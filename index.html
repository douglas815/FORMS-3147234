<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario SENA V1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>FORMULARIO SENA V1</h1>
      <p class="subtitle">GRACIAS POR DEJAR SUS DATOS</p>

      <form class="formulario">
        <label>Name</label>
        <input type="text" placeholder="Please enter your name" />

        <label>Email</label>
        <input type="email" placeholder="Please enter your email" />

        <label>Age</label>
        <input type="number" placeholder="Please enter your age" />

        <label>Choose an option</label>
        <select>
          <option>Select One Option</option>
          <option>Option 1</option>
          <option>Option 2</option>
        </select>

        <label>Do you plan to buy a new car in the next 5 years?</label>
        <div class="radio-group">
          <label><input type="radio" name="buycar" value="yes" /> Yes</label>
          <label><input type="radio" name="buycar" value="no" /> No</label>
          <label
            ><input type="radio" name="buycar" value="maybe" /> Maybe</label
          >
        </div>

        <label>What is your favorite car brand?</label>
        <select>
          <option>Select One Option</option>
          <option>Toyota</option>
          <option>Ford</option>
          <option>Chevrolet</option>
          <option>Other</option>
        </select>

        <label>What type of means of transportation do you own?</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="car" /> Car</label>
          <label><input type="checkbox" value="boat" /> Boat</label>
          <label><input type="checkbox" value="bicycle" /> Bicycle</label>
          <label><input type="checkbox" value="motorcycle" /> Motorcycle</label>
          <label><input type="checkbox" value="plane" /> Plane</label>
          <label><input type="checkbox" value="bike" /> Bike</label>
        </div>

        <label>Any comments or suggestions?</label>
        <textarea placeholder="Please enter your comments"></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
    <div id ="modal-success" class="modal hidden">
        <div vlass="modal-content">
            <h2>Datos enviados con exito</h2>
            <button id="close-modal">CERRAR</button>
        </div>
    </div>
    <script type="module" src="style/main.js"></script>
  </body>
  
</html>
